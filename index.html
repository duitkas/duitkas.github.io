<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mencegah Browser & HP Menyimpan Cache Versi Lama -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>KEMBANG BERSATU - Laporan Keuangan</title>
    
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary-dark);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f9fafb;
        }

        .text-right {
            text-align: right;
        }

        .masuk { color: var(--primary-dark); font-weight: bold; }
        .keluar { color: var(--danger); font-weight: bold; }
        
        .sync-status {
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            color: #6b7280;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>KEMBANG BERSATU</h1>
        <p style="text-align: center; color: #6b7280;">Laporan Keuangan & Kas</p>
    </div>

    <!-- Form Input Transaksi -->
    <div class="card">
        <h3>Tambah Transaksi Baru</h3>
        <form id="cashForm" onsubmit="tambahTransaksi(event)">
            <div class="form-group">
                <label for="tanggal">Tanggal</label>
                <input type="date" id="tanggal" required>
            </div>
            <div class="form-group">
                <label for="keterangan">Keterangan</label>
                <input type="text" id="keterangan" placeholder="Contoh: Iuran Anggota / Pembelian Alat" required>
            </div>
            <div class="form-group">
                <label for="tipe">Jenis Transaksi</label>
                <select id="tipe" required>
                    <option value="masuk">Pemasukan (+)</option>
                    <option value="keluar">Pengeluaran (-)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="jumlah">Jumlah (Rp)</label>
                <input type="number" id="jumlah" min="1" placeholder="100000" required>
            </div>
            <button type="submit">Simpan Transaksi</button>
        </form>
    </div>

    <!-- Tabel Laporan -->
    <div class="card">
        <h3>Riwayat Kas</h3>
        <table id="cashTable">
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>Keterangan</th>
                    <th class="text-right">Jumlah</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Data akan dimuat secara dinamis via JS -->
            </tbody>
        </table>
        <div class="sync-status" id="syncStatus">Memuat data dari server...</div>
    </div>
</div>

<script>
    // URL Google Apps Script Web App (Ganti dengan Web App URL Anda jika menggunakan Google Sheets API)
    const API_URL = ""; 

    document.getElementById('tanggal').valueAsDate = new Date();

    // Memuat data saat halaman dibuka
    document.addEventListener('DOMContentLoaded', muatData);

    async function muatData() {
        const syncStatus = document.getElementById('syncStatus');
        
        if (API_URL) {
            // Ambil dari Google Sheets / Server terpusat jika URL dikonfigurasi
            try {
                syncStatus.innerText = "Menyelaraskan data dari server...";
                const response = await fetch(API_URL + '?action=read&t=' + new Date().getTime());
                const data = await response.json();
                tampilkanData(data);
                syncStatus.innerText = "Data tersinkronisasi dengan server.";
            } catch (err) {
                console.error(err);
                syncStatus.innerText = "Gagal terhubung ke server. Menampilkan data lokal.";
                muatDariLokal();
            }
        } else {
            // Jika belum ada server backend, gunakan LocalStorage
            muatDariLokal();
            syncStatus.innerText = "Catatan: Data tersimpan secara lokal di browser ini.";
        }
    }

    function muatDariLokal() {
        const transactions = JSON.parse(localStorage.getItem('kembang_bersatu_kas')) || [];
        tampilkanData(transactions);
    }

    async function tambahTransaksi(e) {
        e.preventDefault();

        const newTrans = {
            id: Date.now(),
            tanggal: document.getElementById('tanggal').value,
            keterangan: document.getElementById('keterangan').value,
            tipe: document.getElementById('tipe').value,
            jumlah: parseInt(document.getElementById('jumlah').value)
        };

        if (API_URL) {
            // Kirim data ke Google Sheets
            try {
                document.getElementById('syncStatus').innerText = "Menyimpan ke server...";
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newTrans)
                });
                muatData();
            } catch (err) {
                alert("Gagal menyimpan ke server online.");
            }
        } else {
            // Simpan ke LocalStorage jika belum ada API
            const transactions = JSON.parse(localStorage.getItem('kembang_bersatu_kas')) || [];
            transactions.unshift(newTrans);
            localStorage.setItem('kembang_bersatu_kas', JSON.stringify(transactions));
            tampilkanData(transactions);
        }

        document.getElementById('cashForm').reset();
        document.getElementById('tanggal').valueAsDate = new Date();
    }

    function tampilkanData(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Belum ada data transaksi.</td></tr>';
            return;
        }

        data.forEach(item => {
            const tr = document.createElement('tr');
            const isMasuk = item.tipe === 'masuk';
            const jumlahFormat = (isMasuk ? '+ ' : '- ') + 'Rp ' + Number(item.jumlah).toLocaleString('id-ID');
            
            tr.innerHTML = `
                <td>${item.tanggal}</td>
                <td>${item.keterangan}</td>
                <td class="text-right ${isMasuk ? 'masuk' : 'keluar'}">${jumlahFormat}</td>
            `;
            tbody.appendChild(tr);
        });
    }
</script>

</body>
</html>
