<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta Tag Anti-Cache (Agar HP Lain Memuat Versi Terbaru) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>KEMBANG BERSATU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-24">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <h1 class="text-xl font-bold tracking-wide">KEMBANG BERSATU</h1>
            <div class="flex gap-2">
                <button onclick="backupData()" class="p-2 bg-blue-500 rounded-full hover:bg-blue-700 text-xs flex items-center gap-1" title="Backup Data">
                    <i class="fas fa-download"></i> Backup
                </button>
                <button onclick="document.getElementById('restoreFile').click()" class="p-2 bg-blue-500 rounded-full hover:bg-blue-700 text-xs flex items-center gap-1" title="Restore Data">
                    <i class="fas fa-upload"></i> Restore
                </button>
                <input type="file" id="restoreFile" class="hidden" accept=".json" onchange="restoreData(event)">
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto p-4 space-y-4">

        <!-- Info Saldo Utama -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-700 rounded-2xl p-5 text-white shadow-lg">
            <p class="text-sm opacity-80">Total Saldo Kas</p>
            <h2 id="totalSaldo" class="text-3xl font-extrabold my-1">Rp 0</h2>
            <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-blue-400/50 text-xs">
                <div>
                    <span class="opacity-75 block">Pemasukan</span>
                    <span id="totalMasuk" class="font-bold text-green-300 text-sm">Rp 0</span>
                </div>
                <div>
                    <span class="opacity-75 block">Pengeluaran</span>
                    <span id="totalKeluar" class="font-bold text-red-300 text-sm">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- Dashboard Grafik / Statistik Singkat -->
        <div id="sec-dashboard" class="bg-white p-4 rounded-xl shadow-sm">
            <h3 class="font-bold text-gray-700 mb-2 text-sm">Ringkasan Keuangan</h3>
            <div class="h-40">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <!-- Section Transaksi -->
        <div id="sec-transaksi" class="bg-white p-4 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-gray-700">Riwayat Transaksi</h3>
                <div class="flex gap-1">
                    <select id="filterKategori" onchange="render()" class="text-xs border rounded p-1">
                        <option value="semua">Semua</option>
                        <option value="masuk">Masuk</option>
                        <option value="keluar">Keluar</option>
                    </select>
                </div>
            </div>
            
            <!-- List Transaksi -->
            <div id="listTransaksi" class="space-y-2 max-h-80 overflow-y-auto no-scrollbar">
                <!-- Data dimasukkan via JS -->
            </div>
        </div>

        <!-- Section Laporan / Export -->
        <div id="sec-laporan" class="bg-white p-4 rounded-xl shadow-sm space-y-3">
            <h3 class="font-bold text-gray-700">Cetak & Export Laporan</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="exportExcel()" class="bg-green-600 text-white p-2 rounded-lg font-semibold text-xs flex items-center justify-center gap-2 hover:bg-green-700">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button onclick="exportPDF()" class="bg-red-600 text-white p-2 rounded-lg font-semibold text-xs flex items-center justify-center gap-2 hover:bg-red-700">
                    <i class="fas fa-file-pdf"></i> Export PDF
                </button>
            </div>
        </div>

    </div>

    <!-- Floating Button Add -->
    <button onclick="openModal()" class="fixed bottom-20 right-5 bg-blue-600 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center text-2xl hover:bg-blue-700 transition-all z-40">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal Form Transaksi -->
    <div id="modalForm" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl w-full max-w-md p-5 space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modalTitle" class="font-bold text-lg">Tambah Transaksi</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="txForm" onsubmit="saveTransaksi(event)" class="space-y-3">
                <input type="hidden" id="txId">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Jenis Transaksi</label>
                    <select id="txType" class="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="masuk">Pemasukan (+)</option>
                        <option value="keluar">Pengeluaran (-)</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Jumlah (Rp)</label>
                    <input type="number" id="txAmount" required class="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="0">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Tanggal</label>
                    <input type="date" id="txDate" required class="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Keterangan</label>
                    <textarea id="txDesc" required class="w-full border rounded-lg p-2 text-sm mt-1 focus:ring-2 focus:ring-blue-500 outline-none" rows="2" placeholder="Catatan transaksi..."></textarea>
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-gray-200 text-gray-700 p-2 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="w-1/2 bg-blue-600 text-white p-2 rounded-lg text-sm font-semibold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-xs font-medium text-gray-500 max-w-md mx-auto z-30">
        <button onclick="scrollToSec('sec-dashboard')" class="flex flex-col items-center gap-1 text-blue-600">
            <i class="fas fa-chart-pie text-lg"></i>
            <span>Dashboard</span>
        </button>
        <button onclick="scrollToSec('sec-transaksi')" class="flex flex-col items-center gap-1 hover:text-blue-600">
            <i class="fas fa-list text-lg"></i>
            <span>Transaksi</span>
        </button>
        <button onclick="scrollToSec('sec-laporan')" class="flex flex-col items-center gap-1 hover:text-blue-600">
            <i class="fas fa-file-alt text-lg"></i>
            <span>Laporan</span>
        </button>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let transactions = JSON.parse(localStorage.getItem('kb_transactions')) || [];
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('txDate').valueAsDate = new Date();
            initChart();
            render();
        });

        function saveTransaksi(e) {
            e.preventDefault();
            const id = document.getElementById('txId').value;
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;
            const desc = document.getElementById('txDesc').value;

            if (id) {
                const index = transactions.findIndex(t => t.id == id);
                if (index !== -1) {
                    transactions[index] = { id: parseInt(id), type, amount, date, desc };
                }
            } else {
                const newTx = {
                    id: Date.now(),
                    type,
                    amount,
                    date,
                    desc
                };
                transactions.unshift(newTx);
            }

            localStorage.setItem('kb_transactions', JSON.stringify(transactions));
            closeModal();
            render();
        }

        function deleteTx(id) {
            if (confirm('Yakin ingin menghapus transaksi ini?')) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('kb_transactions', JSON.stringify(transactions));
                render();
            }
        }

        function editTx(id) {
            const tx = transactions.find(t => t.id === id);
            if (tx) {
                document.getElementById('txId').value = tx.id;
                document.getElementById('txType').value = tx.type;
                document.getElementById('txAmount').value = tx.amount;
                document.getElementById('txDate').value = tx.date;
                document.getElementById('txDesc').value = tx.desc;
                document.getElementById('modalTitle').innerText = 'Edit Transaksi';
                document.getElementById('modalForm').classList.remove('hidden');
                document.getElementById('modalForm').classList.add('flex');
            }
        }

        function render() {
            const list = document.getElementById('listTransaksi');
            const filter = document.getElementById('filterKategori').value;
            list.innerHTML = '';

            let totalMasuk = 0;
            let totalKeluar = 0;

            const filtered = transactions.filter(t => filter === 'semua' || t.type === filter);

            transactions.forEach(t => {
                if (t.type === 'masuk') totalMasuk += t.amount;
                if (t.type === 'keluar') totalKeluar += t.amount;
            });

            const totalSaldo = totalMasuk - totalKeluar;

            document.getElementById('totalSaldo').innerText = formatRupiah(totalSaldo);
            document.getElementById('totalMasuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('totalKeluar').innerText = formatRupiah(totalKeluar);

            if (filtered.length === 0) {
                list.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">Belum ada transaksi</p>';
            } else {
                filtered.forEach(t => {
                    const isMasuk = t.type === 'masuk';
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center p-3 border-b hover:bg-gray-50 text-xs rounded-lg';
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center ${isMasuk ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                                <i class="fas ${isMasuk ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                            </div>
                            <div>
                                <p class="font-bold text-gray-800">${t.desc}</p>
                                <p class="text-gray-400 text-[10px]">${t.date}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${isMasuk ? 'text-green-600' : 'text-red-600'}">
                                ${isMasuk ? '+' : '-'} ${formatRupiah(t.amount)}
                            </p>
                            <div class="flex gap-2 justify-end mt-1 text-gray-400">
                                <button onclick="editTx(${t.id})" class="hover:text-blue-600"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteTx(${t.id})" class="hover:text-red-600"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            updateChart(totalMasuk, totalKeluar);
        }

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function openModal() {
            document.getElementById('txId').value = '';
            document.getElementById('txForm').reset();
            document.getElementById('txDate').valueAsDate = new Date();
            document.getElementById('modalTitle').innerText = 'Tambah Transaksi';
            document.getElementById('modalForm').classList.remove('hidden');
            document.getElementById('modalForm').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modalForm').classList.add('hidden');
            document.getElementById('modalForm').classList.remove('flex');
        }

        function initChart() {
            const ctx = document.getElementById('financeChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#34D399', '#F87171']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function updateChart(masuk, keluar) {
            if (chartInstance) {
                chartInstance.data.datasets[0].data = [masuk, keluar];
                chartInstance.update();
            }
        }

        function scrollToSec(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function backupData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_kas_kembang_bersatu_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function restoreData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function() {
                try {
                    const data = JSON.parse(fileReader.result);
                    if (Array.isArray(data)) {
                        transactions = data;
                        localStorage.setItem('kb_transactions', JSON.stringify(transactions));
                        render();
                        alert('Data berhasil dipulihkan!');
                    } else {
                        alert('Format file backup tidak valid.');
                    }
                } catch (e) {
                    alert('Gagal membaca file backup.');
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function exportExcel() {
            const wsData = [
                ["ID", "Tanggal", "Jenis", "Keterangan", "Jumlah (Rp)"]
            ];
            transactions.forEach(t => {
                wsData.push([t.id, t.date, t.type, t.desc, t.amount]);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan Kas");
            XLSX.writeFile(wb, `Laporan_Kas_Kembang_Bersatu.xlsx`);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.text("Laporan Keuangan - KEMBANG BERSATU", 14, 15);
            
            const tableData = transactions.map(t => [
                t.date,
                t.type === 'masuk' ? 'Pemasukan' : 'Pengeluaran',
                t.desc,
                `Rp ${t.amount.toLocaleString('id-ID')}`
            ]);

            doc.autoTable({
                head: [['Tanggal', 'Jenis', 'Keterangan', 'Jumlah']],
                body: tableData,
                startY: 20
            });

            doc.save(`Laporan_Kas_Kembang_Bersatu.pdf`);
        }
    </script>
</body>
</html>
